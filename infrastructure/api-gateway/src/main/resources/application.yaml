spring:
  application:
    name: api-gateway
  cloud:
   gateway:
      routes:
        - id: product-service
          uri: http://localhost:8081/
          predicates:
            - Path=/api/products/**, /api/admin/products/**, /api/categories/**, /api/admin/categories/**

        - id: order-service
          uri: http://localhost:8082/
          predicates:
            - Path=/api/orders/**
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, routes
