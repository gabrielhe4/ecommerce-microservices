spring:
  application:
    name: api-gateway
  cloud:
   gateway:
    server:
      webmvc:
        routes:
          - id: product-service
            uri: ${PRODUCT_URI:http://localhost:8081}
            predicates:
              - Path=/api/products/**, /api/admin/products/**, /api/categories/**, /api/admin/categories/**, /api/categories, /api/products

          - id: order-service
            uri: ${ORDER_URI:http://localhost:8082}
            predicates:
              - Path=/api/orders/**
            
          - id: inventory-service
            uri: ${INVENTORY_URI:http://localhost:8083}
            predicates:
              - Path=/api/stock/**, /api/admin/stock

          - id: auth-service
            uri: ${AUTH_URI:http://localhost:8084}
            predicates:
                - Path=/auth/**
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, routes
