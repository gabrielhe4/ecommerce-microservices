spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_inventory
    username: dev
    password: dev
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5672
    username: dev
    password: dev

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
